# =============================================================
# CẤU HÌNH CHUNG CỦA DỰ ÁN – mọi tham số đặt tại đây, không ghi cứng trong code
# Đường dẫn tương đối tính từ thư mục gốc dự án (NHOM_14_DU_AN_HOC_MAY)
# Các giá trị có ghi chú "ĐỀ XUẤT" đang chờ nhóm xác nhận
# =============================================================

project:
  name: "Nhận diện sản phẩm siêu thị - Nhóm 14"
  seed: 42                       # hạt giống ngẫu nhiên để kết quả tái lập được

paths:
  products: configs/products.csv # danh mục lớp + bảng giá (nguồn dữ liệu duy nhất)
  raw_images: data/raw/images    # ảnh gốc sau khi chụp
  raw_labels: data/raw/labels    # nhãn YOLO (.txt) xuất từ công cụ gán nhãn
  roboflow_export: data/roboflow_export_v1  # thư mục giải nén bản xuất YOLOv8 từ Roboflow
  yolo_dir: data/yolo            # bộ dữ liệu YOLO đã chia tập (sinh tự động)
  crops_dir: data/crops          # ảnh cắt cho nhánh phân loại (sinh tự động)
  models_dir: models             # trọng số mô hình đã huấn luyện
  logs_dir: Logs                 # thống kê, nhật ký huấn luyện, biểu đồ

split:                           # ĐỀ XUẤT – tỉ lệ chia theo ảnh gốc (tổng = 1.0)
  train: 0.70
  val: 0.15
  test: 0.15

crops:                           # tạo dữ liệu phân loại từ khung bao
  padding: 0.05                  # nới khung thêm 5% mỗi phía để không mất mép sản phẩm
  min_size: 32                   # ĐỀ XUẤT – bỏ khung có cạnh ngắn < 32 px

data_check:
  image_exts: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  min_box_size: 0.01             # cảnh báo khung có cạnh < 1% kích thước ảnh (nghi nhãn lỗi)

detection:                       # huấn luyện YOLO (chốt 22/10/2026: chỉ dùng YOLO26n)
  models:                        # tên ngắn -> trọng số pretrained COCO của Ultralytics
    yolo26n: yolo26n.pt
  imgsz: 640                     # kích thước ảnh đầu vào
  epochs: 100
  patience: 20                   # dừng sớm nếu 20 epoch liên tiếp không cải thiện
  batch: 16
  device: null                   # null = Ultralytics tự chọn (GPU nếu có); có thể đặt 0 hoặc "cpu"
  workers: 2                     # số luồng đọc dữ liệu (Colab ít CPU)
  conf: 0.25                     # ngưỡng tin cậy khi dự đoán
  iou: 0.7                       # ngưỡng IoU khi lọc khung trùng lúc đánh giá

  finetune:                      # ĐỀ XUẤT 01/11/2026 – huấn luyện thêm từ best.pt hiện có
    base: yolo26n                # điểm xuất phát: models/yolo26n/weights/best.pt (không ghi đè)
    epochs: 80
    patience: 30                 # nới hơn lần đầu vì lr nhỏ, mAP tăng chậm
    optimizer: AdamW             # đặt rõ để lr0 có hiệu lực (optimizer=auto sẽ bỏ qua lr0)
    lr0: 0.0005                  # nhỏ hơn lần đầu ~10 lần: tinh chỉnh, không phá trọng số đã học
    warmup_epochs: 1
    cos_lr: true                 # giảm lr dần theo hàm cos ở cuối quá trình
    augment:                     # tăng cường dữ liệu thêm so với mặc định của Ultralytics
      degrees: 10                # xoay ±10° (sản phẩm đặt lệch góc trên bàn)
      scale: 0.5                 # phóng/thu ±50%
      mixup: 0.1                 # trộn 2 ảnh, chống học thuộc khi dữ liệu ít
      hsv_h: 0.01                # giảm đổi màu (màu bao bì giúp phân biệt Hảo Hảo/Tomyum)
      close_mosaic: 15           # tắt mosaic ở 15 epoch cuối để khung bao sát hơn
    runs:                        # mỗi lượt lưu ở models/yolo26n_<tên lượt>/
      ft640: {imgsz: 640}        # giữ kích thước như ứng dụng, chỉ đổi cách huấn luyện
      ft832: {imgsz: 832}        # ảnh lớn hơn, giúp khung bao chính xác hơn (mAP50-95) nhưng chậm hơn

app:                             # chương trình mô phỏng quầy thanh toán (Streamlit)
  model: yolo26n                 # mô hình chính, trọng số models/yolo26n/weights/best.pt
  conf: 0.45                     # ngưỡng độ tin cậy mặc định (người dùng chỉnh được trên giao diện)
  imgsz: 640
  store_name: "Mô phỏng quầy thanh toán"
  receipt_dir: Logs/receipts     # nơi lưu hóa đơn PDF đã xuất
  admin_pin: "1414"             # mã PIN vào trang Quản trị (khóa đơn giản cho bản mô phỏng)
  currency: "đ"
